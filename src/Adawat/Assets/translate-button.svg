<!-- Source of translate-button.png, the button shown next to selected text. 44x44 = the button window in DIPs;
     the PNG is this drawing rendered at 4x (176 px) on a transparent background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDF4"/>
    </linearGradient>
    <linearGradient id="plateEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F1F4F9"/>
      <stop offset="1" stop-color="#CBD3E0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6FA0FF"/>
      <stop offset="0.55" stop-color="#3D6BFA"/>
      <stop offset="1" stop-color="#5B45E8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <clipPath id="frontClip">
      <path id="bubble" d="M14.5 10.5h9a3.5 3.5 0 0 1 3.5 3.5v8a3.5 3.5 0 0 1-3.5 3.5h-6.2l-3.6 3.1a0.6 0.6 0 0 1-1-0.45v-2.75a3.5 3.5 0 0 1-1.7-3.4v-8a3.5 3.5 0 0 1 3.5-3.5z"/>
    </clipPath>
  </defs>

  <!-- Soft shadow under the glass plate -->
  <rect x="7" y="8" width="30" height="30" rx="10" fill="#1E293B" opacity="0.22" filter="url(#soft)"/>
  <rect x="6.5" y="6" width="31" height="31" rx="10" fill="#1E293B" opacity="0.10" filter="url(#tight)"/>

  <!-- Frosted plate -->
  <rect x="6" y="5" width="32" height="32" rx="10" fill="url(#plate)"/>
  <rect x="6.4" y="5.4" width="31.2" height="31.2" rx="9.6" fill="none" stroke="url(#plateEdge)" stroke-width="0.8"/>
  <rect x="6" y="5" width="32" height="32" rx="10" fill="none" stroke="#0F172A" stroke-opacity="0.09" stroke-width="0.5"/>

  <!-- Back card: frosted, with the Arabic letter -->
  <rect x="20" y="14.5" width="14.5" height="17" rx="3.6" fill="#334155" opacity="0.18" filter="url(#cardShadow)" transform="translate(0 0.8)"/>
  <rect x="20" y="14.5" width="14.5" height="17" rx="3.6" fill="url(#back)"/>
  <rect x="20.25" y="14.75" width="14" height="16.5" rx="3.35" fill="none" stroke="url(#rim)" stroke-width="0.5"/>
  <text x="30.6" y="28.6" font-family="DejaVu Sans, Segoe UI, sans-serif" font-weight="bold" font-size="8" fill="#5B6B82" text-anchor="middle">ع</text>

  <!-- Front card: glossy blue speech bubble with the Latin letter -->
  <use href="#bubble" fill="#1E3A8A" opacity="0.30" filter="url(#cardShadow)" transform="translate(0.3 1)"/>
  <use href="#bubble" fill="url(#front)"/>
  <g clip-path="url(#frontClip)">
    <ellipse cx="17.5" cy="10.5" rx="12" ry="7" fill="url(#gloss)"/>
  </g>
  <use href="#bubble" fill="none" stroke="url(#rim)" stroke-width="0.55"/>
  <text x="18.75" y="21.7" font-family="Inter, Segoe UI, sans-serif" font-weight="700" font-size="9.5" fill="#FFFFFF" text-anchor="middle">A</text>
</svg>
